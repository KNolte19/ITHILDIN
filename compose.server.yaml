services:
  ithildin-app:
    build:
      dockerfile: Dockerfile
      args:
        - REQUIREMENTS_FILE=requirements.server.txt
    container_name: ithildin_wing_analysis
    ports:
      - 127.0.0.1:8080:8080
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-CHANGEME-INSECURE-DEFAULT}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
